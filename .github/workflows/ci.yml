# CI for the lightsmith-materials repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"
      - run: uv sync --frozen
      - name: requirements.lock matches uv.lock
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/req.lock && diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/req.lock)
      - name: unit tests (SQLite)
        run: uv run --frozen pytest -q  # --frozen: the ../lightsmith path source is not checked out in CI
      - name: unit tests (Postgres)
        run: uv run --frozen pytest -q  # --frozen: the ../lightsmith path source is not checked out in CI
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lightsmith-materials:ci .
      - name: compose smoke test
        run: |
          cp .env.example .env
          docker compose up -d --wait api
          curl -fsS http://localhost:8100/healthz
          docker compose run --rm api materials-db stats
          docker compose down -v
